name: "SAST: KICS"

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kics:
    name: KICS scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run KICS
        uses: Checkmarx/kics-github-action@v2.1.20
        with:
          path: .
          type: Terraform
          fail_on: high
          output_formats: json
          exclude_queries: "e38a8e0a-b88b-4902-b3fe-b0571e3c97ec"
